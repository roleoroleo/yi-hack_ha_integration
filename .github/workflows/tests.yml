name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run tests
        run: python -m pytest
      - name: Lint changed integration modules
        run: >-
          ruff check
          custom_components/yi_hack/__init__.py
          custom_components/yi_hack/button.py
          custom_components/yi_hack/common.py
          custom_components/yi_hack/config_flow.py
          custom_components/yi_hack/coordinator.py
          custom_components/yi_hack/media_source.py
          custom_components/yi_hack/sensor.py
          custom_components/yi_hack/update.py
          custom_components/yi_hack/views.py
          tests
